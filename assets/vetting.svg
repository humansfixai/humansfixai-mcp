<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="How developers are approved: apply, reviewed by hand, approved, then they take requests"><rect width="1000" height="210" fill="#fafaf9"/><g transform="translate(30 30)"><rect width="215" height="150" rx="14" fill="#fff" stroke="#e7e5e4"/>
<circle cx="32" cy="36" r="16" fill="#ea580c"/><text x="32" y="42" text-anchor="middle" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">1</text>
<text x="18" y="84" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Apply</text>
<text x="18" y="108" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">A developer tells us</text><text x="18" y="126" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">about their experience.</text></g><path d="M249 105 h14" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/><g transform="translate(270 30)"><rect width="215" height="150" rx="14" fill="#fff1e6" stroke="#ea580c"/>
<circle cx="32" cy="36" r="16" fill="#ea580c"/><text x="32" y="42" text-anchor="middle" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">2</text>
<text x="18" y="84" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Reviewed by hand</text>
<text x="18" y="108" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">We read every</text><text x="18" y="126" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">application ourselves.</text></g><path d="M489 105 h14" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/><g transform="translate(510 30)"><rect width="215" height="150" rx="14" fill="#fff" stroke="#e7e5e4"/>
<circle cx="32" cy="36" r="16" fill="#ea580c"/><text x="32" y="42" text-anchor="middle" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">3</text>
<text x="18" y="84" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Approved</text>
<text x="18" y="108" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Only then can they</text><text x="18" y="126" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">see any request.</text></g><path d="M729 105 h14" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/><g transform="translate(750 30)"><rect width="215" height="150" rx="14" fill="#fff" stroke="#e7e5e4"/>
<circle cx="32" cy="36" r="16" fill="#ea580c"/><text x="32" y="42" text-anchor="middle" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#fff">4</text>
<text x="18" y="84" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Takes your request</text>
<text x="18" y="108" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Proposes a time and</text><text x="18" y="126" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">joins a free call.</text></g></svg>