<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="From your chat to a free call in five steps"><rect width="1200" height="240" fill="#fafaf9"/><g transform="translate(20 20)"><rect width="224" height="200" rx="14" fill="#fff" stroke="#e7e5e4"/>

<g transform="translate(14 40) scale(1.5)" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></g>
<text x="14" y="124" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Ask in your chat</text>
<text x="14" y="150" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Tell your assistant</text>
<text x="14" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">what you need.</text></g><g transform="translate(256 20)"><rect width="224" height="200" rx="14" fill="#fff1e6" stroke="#ea580c"/>
<text x="14" y="26" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#c2410c">YOUR CALL</text>
<g transform="translate(14 40) scale(1.5)" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></g>
<text x="14" y="124" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">You say yes</text>
<text x="14" y="150" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">It shows the exact text.</text>
<text x="14" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Nothing goes out without it.</text></g><g transform="translate(492 20)"><rect width="224" height="200" rx="14" fill="#fff" stroke="#e7e5e4"/>

<g transform="translate(14 40) scale(1.5)" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM5 20c1-4 4-6 7-6s6 2 7 6"/></g>
<text x="14" y="124" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">A developer picks it up</text>
<text x="14" y="150" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Approved by hand</text>
<text x="14" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">before they see a request.</text></g><g transform="translate(728 20)"><rect width="224" height="200" rx="14" fill="#fff" stroke="#e7e5e4"/>

<g transform="translate(14 40) scale(1.5)" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h13v10H3zM16 11l5-3v9l-5-3"/></g>
<text x="14" y="124" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Free 15-minute call</text>
<text x="14" y="150" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Video call on Google Meet.</text>
<text x="14" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">No card needed.</text></g><g transform="translate(964 20)"><rect width="224" height="200" rx="14" fill="#fff1e6" stroke="#ea580c"/>
<text x="14" y="26" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#c2410c">YOUR CALL</text>
<g transform="translate(14 40) scale(1.5)" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.1-4 2.8c0 4 8 2 8 6 0 1.7-1.8 3-4 3s-4-1.3-4-3"/></g>
<text x="14" y="124" font-family="Space Grotesk,Inter,system-ui,sans-serif" font-weight="700" font-size="16" fill="#1c1917">Need more? One price</text>
<text x="14" y="150" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">Fixed, never hourly. You pay</text>
<text x="14" y="168" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#57534e">only after you approve.</text></g></svg>