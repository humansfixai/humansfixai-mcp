<g class="m0"><rect x="380" y="84" width="360" height="66" rx="12" fill="#ea580c" stroke="none"/><text x="394" y="104" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#ffffff">Checkout works locally but fails after deploy.</text><text x="394" y="124" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#ffffff">Your third fix did not help either.</text></g><g class="m1"><text x="60" y="179" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#78716c">● ask_human_developer  ·  draft saved</text></g><g class="m2"><rect x="60" y="200" width="600" height="106" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="74" y="220" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1c1917">Three fixes did not work, so a real developer should look.</text><text x="74" y="240" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1c1917">Here is the exact text. Nothing has been sent:</text><text x="74" y="260" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1c1917">“Stripe checkout fails after deploy. Works locally.</text><text x="74" y="280" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1c1917">Please review the env vars and the webhook.”  Send it?</text></g><g class="m3"><rect x="380" y="320" width="360" height="46" rx="12" fill="#ea580c" stroke="none"/><text x="394" y="340" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#ffffff">Yes, send it.</text></g><g class="m4"><text x="60" y="395" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#78716c">● send_request  ·  sent</text></g><g class="m5"><rect x="60" y="416" width="600" height="66" rx="12" fill="#ecfdf5" stroke="#86efac"/><text x="74" y="436" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#15803d">A developer accepted. Free 15-minute call: Tue 15:00.</text><text x="74" y="456" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#15803d">Confirm the time?</text></g></svg>